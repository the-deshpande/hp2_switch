[general]
channels = stereo
sample-type = int16
frequency = 48000
# Larger mix periods: the Switch CPU cannot keep up with small periods while the
# game is rendering, and every underrun is heard as crackling (most obvious on
# dialogue, which is played unattenuated).
period_size = 1024
periods = 4
resampler = cubic
default-resampler = cubic
# "headphones" stereo mode turns HRTF on automatically, which is far too costly
# for the Switch mixer thread. Plain stereo panning instead.
hrtf = false
stereo-mode = speakers
stereo-encoding = panpot
output-limiter = true
